<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twitch Logo Colorizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --twitch-bg:           #0e0e10;
    --twitch-surface:      #18181b;
    --twitch-surface2:     #1f1f23;
    --twitch-surface3:     #26262c;
    --twitch-border:       #2c2c31;
    --twitch-border2:      #3a3a3f;
    --twitch-purple:       #9147ff;
    --twitch-purple-hover: #772ce8;
    --twitch-purple-faint: rgba(145,71,255,0.1);
    --twitch-purple-glow:  rgba(145,71,255,0.15);
    --twitch-text:         #efeff1;
    --twitch-text-alt:     #dedee3;
    --twitch-text-dim:     #adadb8;
    --twitch-text-muted:   #6e6e78;
    --twitch-success:      #00c8a0;
    --twitch-warning:      #ffb31a;
    --twitch-error:        #ff6b6b;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --sidebar-width: 310px;
    --nav-height: 70px;
    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-lg: 8px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--twitch-bg);
    color: var(--twitch-text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- progress bar ---------- */
  #fetchBar {
    height: 3px; background: var(--twitch-surface2);
    position: fixed; top: var(--nav-height); left: 0; right: 0; z-index: 99;
    overflow: hidden; opacity: 0; transition: opacity .25s ease;
  }
  #fetchBar.active { opacity: 1; }
  #fetchBarFill {
    height: 100%; width: 0%; background: var(--twitch-purple);
    transition: width .3s ease, background-color .3s ease;
    box-shadow: 0 0 8px rgba(145,71,255,.6);
  }
  #fetchBarFill.done { background: var(--twitch-success); box-shadow: 0 0 8px rgba(0,200,160,.6); }

  /* ---------- topnav ---------- */
  .topnav {
    position: fixed; top: 0; left: 0; right: 0; height: var(--nav-height);
    background: var(--twitch-surface2); border-bottom: 1px solid var(--twitch-border);
    display: flex; align-items: center; padding: 0 20px; z-index: 100;
  }
  .topnav-mark {
    cursor: pointer; user-select: none; display: flex; align-items: center; gap: 12px;
  }
  .topnav-logo { height: 34px; width: auto; display: block; }
  .topnav-title {
    font-size: 21px; font-weight: 700; letter-spacing: -0.02em; color: var(--twitch-text);
  }
  .topnav-title .accent { color: var(--twitch-purple); }


  /* ---------- layout shell ---------- */
  .sidebar {
    position: fixed; top: var(--nav-height); bottom: 0; left: 0; width: var(--sidebar-width);
    background: var(--twitch-surface); border-right: 1px solid var(--twitch-border);
    overflow-y: auto; z-index: 90;
  }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--twitch-border2); border-radius: 2px; }

  .sb-section { padding: 14px; border-bottom: 1px solid var(--twitch-border); }
  .tw-label {
    font-size: 10px; font-weight: 700; color: var(--twitch-text-alt);
    text-transform: uppercase; letter-spacing: .08em; display: block; margin-bottom: 8px;
  }
  .field-label {
    font-size: 11px; font-weight: 600; color: var(--twitch-text-muted);
    letter-spacing: .01em; display: block; margin-bottom: 5px;
  }

  .main-content {
    margin-left: var(--sidebar-width); margin-top: var(--nav-height);
    min-height: calc(100vh - var(--nav-height));
    display: flex; align-items: center; justify-content: center; padding: 40px;
  }

  /* ---------- layer select ---------- */
  .layer-select { display: flex; gap: 6px; }
  .layer-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    background: var(--twitch-surface2); border: 1px solid var(--twitch-border2);
    color: var(--twitch-text-dim); font-family: var(--font); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em; padding: 8px; border-radius: var(--radius-md);
    cursor: pointer; transition: all .12s ease;
  }
  .layer-btn:hover { border-color: var(--twitch-border2); color: var(--twitch-text-alt); }
  .layer-btn.active {
    background: var(--twitch-purple-faint); border-color: rgba(145,71,255,.5); color: var(--twitch-purple);
  }
  .layer-btn-icon-wrap {
    width: 100%; height: 40px; border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 7px;
  }
  .layer-btn-icon { max-width: 94%; max-height: 92%; object-fit: contain; display: block; }

  /* ---------- swatch grid ---------- */
  .color-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }

  .mode-toggle { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
  .mode-toggle input { display: none; }
  .mode-toggle-track {
    width: 30px; height: 17px; background: var(--twitch-purple-faint); border: 1px solid rgba(145,71,255,.5);
    border-radius: 999px; position: relative;
  }
  .mode-toggle-thumb {
    position: absolute; top: 1px; left: 1px; width: 13px; height: 13px; border-radius: 50%;
    background: var(--twitch-purple); transition: transform .15s ease;
  }
  .mode-toggle input:checked + .mode-toggle-track .mode-toggle-thumb { transform: translateX(13px); }
  .mode-toggle-label {
    font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--twitch-text-muted);
    transition: color .15s ease;
  }
  .mode-toggle-label.active { color: var(--twitch-text-alt); }

  .swatch-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .swatch {
    aspect-ratio: 1; border-radius: var(--radius-sm); cursor: pointer;
    border: 2px solid var(--twitch-border2); position: relative;
    transition: transform .1s ease, border-color .1s ease;
  }
  .swatch:hover { transform: scale(1.06); }
  .swatch.active { border-color: #fff; box-shadow: 0 0 0 2px var(--twitch-purple); }

  .swatch-tooltip {
    position: fixed; z-index: 200; pointer-events: none;
    background: var(--twitch-surface3); border: 1px solid var(--twitch-border2);
    border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 700;
    color: var(--twitch-text); white-space: nowrap; opacity: 0;
    transition: opacity .1s ease; box-shadow: 0 4px 14px rgba(0,0,0,.45);
  }
  .swatch-tooltip.visible { opacity: 1; }
  .swatch-tooltip .hex { color: var(--twitch-text-muted); font-weight: 600; margin-left: 7px; }

  /* ---------- export ---------- */
  .dim-row { display: flex; align-items: flex-end; gap: 8px; }
  .dim-field { flex: 1; }
  .dim-x { padding-bottom: 8px; color: var(--twitch-text-muted); font-size: 12px; }
  .tw-input {
    width: 100%; background: var(--twitch-surface2); border: 1px solid var(--twitch-border2);
    border-radius: var(--radius-md); color: var(--twitch-text); font-family: var(--font);
    font-size: 13px; padding: 7px 10px; outline: none; transition: border-color .1s, box-shadow .1s;
  }
  .tw-input:focus { border-color: var(--twitch-purple); box-shadow: 0 0 0 3px var(--twitch-purple-glow); }

  .upscale-toggle {
    display: flex; align-items: center; gap: 8px; margin-top: 10px;
    font-size: 12px; color: var(--twitch-text-dim); cursor: pointer; user-select: none;
  }
  .upscale-toggle input { accent-color: var(--twitch-purple); width: 14px; height: 14px; cursor: pointer; }
  .upscale-toggle .upscale-hint { color: var(--twitch-text-muted); }
  .upscale-toggle.disabled-row { opacity: .45; pointer-events: none; }

  .tw-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: none; border-radius: 999px; font-family: var(--font);
    font-size: 13px; font-weight: 600; cursor: pointer; padding: 10px 14px; transition: background .12s ease;
  }
  .tw-btn-primary { background: var(--twitch-purple); color: #fff; }
  .tw-btn-primary:hover { background: var(--twitch-purple-hover); }
  .tw-btn-primary:disabled { opacity: .5; cursor: default; }
  .tw-btn-sm { padding: 5px 10px; font-size: 11px; font-weight: 700; }
  .tw-btn-ghost { background: transparent; border: 1px solid var(--twitch-border2); color: var(--twitch-text-dim); }
  .tw-btn-ghost:hover { border-color: var(--twitch-text-muted); color: var(--twitch-text); }

  /* ---------- preview ---------- */
  .preview-wrap {
    width: 100%; max-width: 1400px; border-radius: var(--radius-lg);
    background-image:
      linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%);
    background-size: 24px 24px; background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    background-color: #161618;
    padding: 32px; position: relative;
  }
  #previewCanvas { display: block; width: 100%; height: auto; }

  .preview-stack { display: flex; flex-direction: column; align-items: center; gap: 22px; width: 100%; }

  .selection-summary { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .selection-chip {
    display: flex; align-items: center; gap: 10px;
    background: var(--twitch-surface2); border: 1px solid var(--twitch-border2);
    border-radius: var(--radius-lg); padding: 10px 16px;
  }
  .selection-chip .chip-dot {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--twitch-border2); flex-shrink: 0;
  }
  .selection-chip .chip-text { display: flex; flex-direction: column; line-height: 1.35; }
  .selection-chip .chip-layer {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    color: var(--twitch-text-muted);
  }
  .selection-chip .chip-color { font-size: 13px; font-weight: 700; color: var(--twitch-text); }
  .selection-chip .chip-hex { font-size: 11px; font-weight: 600; color: var(--twitch-text-muted); margin-left: 6px; }

  .state-container { text-align: center; padding: 72px 24px; }
  .state-title { font-size: 15px; font-weight: 700; color: var(--twitch-text-dim); margin-bottom: 6px; }
  .state-body { font-size: 12px; color: var(--twitch-text-muted); }

  @media (max-width: 760px) {
    .sidebar { position: static; width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--twitch-border); }
    .main-content { margin-left: 0; }
  }
</style>
</head>

      label: "Wordmark",
      assetPrefix: "",
      layers: ["Face", "Outline", "Extrusion"],
      drawOrder: ["Outline", "Face", "Extrusion"], // back to front — Extrusion on top, Outline on bottom
      nativeW: 5852, nativeH: 1948,
      previewMaxWidth: 1400,
      // Face's source files were padded to the native canvas with content vertically centered,
      // which doesn't match where Outline/Extrusion sit. Measured directly against Outline's
      // inner edges: Face needs to move up 225px at native resolution. See chat history.
      yOffset: { Face: -225, Outline: 0, Extrusion: 0 },
      defaultSelection: { Face: "White", Outline: "TwitchPurple", Extrusion: "TwitchPurple" },
    },
    Glitch: {
      label: "Glitch",
      assetPrefix: "Glitch_",
      layers: ["Face", "Extrusion"],
      drawOrder: ["Extrusion", "Face"], // Face on top — unlike Wordmark, Glitch's Extrusion shape likely overlaps Face rather than just trailing beside it; drawing Extrusion first keeps it from hiding Face entirely
      nativeW: 2396, nativeH: 2944,
      previewMaxWidth: 455, // 700px minus another 35%, per request
      // No known misalignment yet — these files haven't been through the same registration
      // check the Wordmark's Face layer got. Verify visually once live; adjust here if needed.
      yOffset: { Face: 0, Extrusion: 0 },
      defaultSelection: { Face: "White", Extrusion: "TwitchPurple" },
    },
  };

  let activeLogo = "Wordmark";
  let activeLayer = "Face";
  const selection = {
    Wordmark: { ...LOGOS.Wordmark.defaultSelection },
    Glitch: { ...LOGOS.Glitch.defaultSelection },
  };

  function logo() { return LOGOS[activeLogo]; }

  const imgCache = new Map(); // "Logo_Layer_Key" -> HTMLImageElement (loaded)

  function colorFilenameFragment(key, logoKey = activeLogo) {
    const entry = PALETTE.find(p => p.key === key);
    const override = entry && entry.filenameOverrides && entry.filenameOverrides[logoKey];
    return override || key;
  }

  function assetPath(layer, key, logoKey = activeLogo) {
    return `./assets:/${LOGOS[logoKey].assetPrefix}${layer}_${colorFilenameFragment(key, logoKey)}.png`;
  }

  function loadImage(layer, key, logoKey = activeLogo) {
    const cacheKey = `${logoKey}_${layer}_${key}`;
    if (imgCache.has(cacheKey)) return Promise.resolve(imgCache.get(cacheKey));
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => { imgCache.set(cacheKey, img); resolve(img); };
      img.onerror = () => reject(new Error(`Failed to load ${assetPath(layer, key, logoKey)}`));
      img.src = assetPath(layer, key, logoKey);
    });
  }

  // Shared by the main preview and the logo-picker icons: draws a given logo's layers, in that
  // logo's own draw order and y-offset, at whatever target size, using whatever colors are passed in.
  async function drawLogoLayers(targetCtx, targetW, targetH, logoKey, colors) {
    const cfg = LOGOS[logoKey];
    for (const layer of cfg.drawOrder) {
      const img = await loadImage(layer, colors[layer], logoKey);
      const scale = targetH / cfg.nativeH;
      const dy = (cfg.yOffset[layer] || 0) * scale;
      targetCtx.drawImage(img, 0, dy, targetW, targetH);
    }
  }

  // ---------- progress bar ----------
  const fetchBar = document.getElementById('fetchBar');
  const fetchBarFill = document.getElementById('fetchBarFill');
  function barStart() {
    fetchBarFill.classList.remove('done');
    fetchBarFill.style.width = '0%';
    fetchBar.classList.add('active');
  }
  function barProgress(frac) { fetchBarFill.style.width = `${Math.round(frac * 100)}%`; }
  function barDone() {
    fetchBarFill.classList.add('done');
    fetchBarFill.style.width = '100%';
    setTimeout(() => fetchBar.classList.remove('active'), 350);
  }

  // ---------- canvas render ----------
  const canvas = document.getElementById('previewCanvas');
  const previewWrap = document.getElementById('previewWrap');
  function syncPreviewSize() { previewWrap.style.maxWidth = logo().previewMaxWidth + 'px'; }
  const ctx = canvas.getContext('2d');

  async function redraw() {
    barStart();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let done = 0;
    const order = logo().drawOrder;
    try {
      for (const layer of order) {
        const img = await loadImage(layer, selection[activeLogo][layer]);
        const scale = canvas.height / logo().nativeH;
        const dy = (logo().yOffset[layer] || 0) * scale;
        ctx.drawImage(img, 0, dy, canvas.width, canvas.height);
        done++;
        barProgress(done / order.length);
      }
      barDone();
    } catch (err) {
      barDone();
      console.error(err);
      alert(`Couldn't load a layer image.\n\n${err.message}\n\nCheck that the "assets:" folder is deployed next to this HTML file and the filename matches exactly.`);
    }
  }

  // ---------- sidebar: logo select ----------
  const logoSelect = document.getElementById('logoSelect');

  function sizeIconCanvas(canvasEl, nativeW, nativeH, boxW, boxH) {
    const scale = Math.min(boxW / nativeW, boxH / nativeH);
    const dispW = Math.round(nativeW * scale);
    const dispH = Math.round(nativeH * scale);
    canvasEl.style.width = dispW + 'px';
    canvasEl.style.height = dispH + 'px';
    const res = 2; // internal resolution multiplier for crispness on retina displays
    canvasEl.width = dispW * res;
    canvasEl.height = dispH * res;
  }

  function renderLogoButtons() {
    logoSelect.innerHTML = '';
    Object.keys(LOGOS).forEach(key => {
      const cfg = LOGOS[key];
      const btn = document.createElement('button');
      btn.className = 'layer-btn' + (key === activeLogo ? ' active' : '');
      btn.dataset.logo = key;
      const iconWrap = document.createElement('span');
      iconWrap.className = 'layer-btn-icon-wrap';
      const iconCanvas = document.createElement('canvas');
      iconCanvas.className = 'layer-btn-icon';
      sizeIconCanvas(iconCanvas, cfg.nativeW, cfg.nativeH, 82, 34);
      iconWrap.appendChild(iconCanvas);
      const labelSpan = document.createElement('span');
      labelSpan.textContent = cfg.label;
      btn.appendChild(iconWrap);
      btn.appendChild(labelSpan);
      btn.addEventListener('click', () => {
        if (key === activeLogo) return;
        activeLogo = key;
        activeLayer = logo().layers[0];
        canvas.width = logo().nativeW;
        canvas.height = logo().nativeH;
        syncPreviewSize();
        renderLogoButtons();
        renderLayerButtons();
        updateSwatchActiveStates();
        renderSelectionSummary();
        resetDimsToNative();
        redraw();
      });
      logoSelect.appendChild(btn);

      // Render this logo's icon in its actual default colors (white face, purple outline/extrusion),
      // not the flat white silhouette used for the per-layer buttons — this is the full-color preview.
      const iconCtx = iconCanvas.getContext('2d');
      drawLogoLayers(iconCtx, iconCanvas.width, iconCanvas.height, key, cfg.defaultSelection)
        .catch(err => console.error(`Logo icon draw failed for ${key}:`, err));
    });
  }

  // ---------- sidebar: layer select ----------
  const layerSelect = document.getElementById('layerSelect');
  const activeLayerLabel = document.getElementById('activeLayerLabel');

  function renderLayerButtons() {
    layerSelect.innerHTML = '';
    logo().layers.forEach(layerName => {
      const btn = document.createElement('button');
      btn.className = 'layer-btn' + (layerName === activeLayer ? ' active' : '');
      btn.dataset.layer = layerName;
      const iconWrap = document.createElement('span');
      iconWrap.className = 'layer-btn-icon-wrap';
      const img = document.createElement('img');
      img.className = 'layer-btn-icon';
      img.alt = '';
      img.src = `./assets:/${logo().assetPrefix}${layerName}_White.png`;
      iconWrap.appendChild(img);
      const labelSpan = document.createElement('span');
      labelSpan.textContent = layerName;
      btn.appendChild(iconWrap);
      btn.appendChild(labelSpan);
      btn.addEventListener('click', () => {
        activeLayer = layerName;
        [...layerSelect.children].forEach(b => b.classList.toggle('active', b === btn));
        activeLayerLabel.textContent = activeLayer;
        updateSwatchActiveStates();
      });
      layerSelect.appendChild(btn);
    });
    activeLayerLabel.textContent = activeLayer;
  }

  // ---------- sidebar: swatch grid ----------
  const swatchGrid = document.getElementById('swatchGrid');
  const tooltip = document.getElementById('swatchTooltip');
  const cmykToggle = document.getElementById('cmykToggle');
  const hexLabel = document.getElementById('hexLabel');
  const cmykLabel = document.getElementById('cmykLabel');
  let colorMode = 'hex'; // 'hex' | 'cmyk'

  function formatColorValue(c) {
    if (colorMode === 'hex') return `#${c.hex}`;
    if (!c.cmyk) return 'CMYK not set';
    const { c: cy, m, y, k } = c.cmyk;
    return `C${cy} M${m} Y${y} K${k}`;
  }

  cmykToggle.addEventListener('change', () => {
    colorMode = cmykToggle.checked ? 'cmyk' : 'hex';
    hexLabel.classList.toggle('active', colorMode === 'hex');
    cmykLabel.classList.toggle('active', colorMode === 'cmyk');
    renderSelectionSummary();
    // uncompressed CMYK TIFF gets huge fast (native alone is ~46MB) — no upscaling for it
    document.getElementById('allowUpscale').disabled = (colorMode === 'cmyk');
    document.getElementById('upscaleRow').classList.toggle('disabled-row', colorMode === 'cmyk');
    widthInput.dispatchEvent(new Event('input'));
    document.getElementById('exportBtn').textContent = colorMode === 'cmyk' ? 'Export TIFF (CMYK)' : 'Export PNG';
  });

  function positionTooltip(evt) {
    tooltip.style.left = (evt.clientX + 18) + 'px';
    tooltip.style.top = (evt.clientY - 14) + 'px';
  }

  function renderSwatchGrid() {
    swatchGrid.innerHTML = '';
    PALETTE.forEach(c => {
      const el = document.createElement('div');
      el.className = 'swatch';
      el.style.background = `#${c.hex}`;
      el.dataset.key = c.key;
      el.addEventListener('mouseenter', (evt) => {
        tooltip.innerHTML = `${c.label}<span class="hex">${formatColorValue(c)}</span>`;
        tooltip.classList.add('visible');
        positionTooltip(evt);
      });
      el.addEventListener('mousemove', positionTooltip);
      el.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));
      el.addEventListener('click', () => {
        selection[activeLogo][activeLayer] = c.key;
        updateSwatchActiveStates();
        renderSelectionSummary();
        redraw();
      });
      swatchGrid.appendChild(el);
    });
    updateSwatchActiveStates();
  }

  function updateSwatchActiveStates() {
    const current = selection[activeLogo][activeLayer];
    [...swatchGrid.children].forEach(el => {
      el.classList.toggle('active', el.dataset.key === current);
    });
  }

  // ---------- selection summary beneath the canvas ----------
  const selectionSummaryEl = document.getElementById('selectionSummary');
  function renderSelectionSummary() {
    selectionSummaryEl.innerHTML = logo().layers.map(layer => {
      const c = PALETTE.find(p => p.key === selection[activeLogo][layer]);
      return `<div class="selection-chip">
        <span class="chip-dot" style="background:#${c.hex}"></span>
        <span class="chip-text">
          <span class="chip-layer">${layer}</span>
          <span class="chip-color">${c.label}<span class="chip-hex">${formatColorValue(c)}</span></span>
        </span>
      </div>`;
    }).join('');
  }

  // ---------- export dimensions ----------
  const widthInput = document.getElementById('exportWidth');
  const heightInput = document.getElementById('exportHeight');
  const allowUpscale = document.getElementById('allowUpscale');
  const UPSCALE_MULTIPLIER = 3; // native x3 is comfortably under browser canvas size limits

  function maxW() { return (allowUpscale.checked && colorMode === 'hex') ? logo().nativeW * UPSCALE_MULTIPLIER : logo().nativeW; }
  function maxH() { return (allowUpscale.checked && colorMode === 'hex') ? logo().nativeH * UPSCALE_MULTIPLIER : logo().nativeH; }

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

  function resetDimsToNative() {
    widthInput.max = maxW();
    heightInput.max = maxH();
    widthInput.value = logo().nativeW;
    heightInput.value = logo().nativeH;
  }
  resetDimsToNative();

  widthInput.addEventListener('input', () => {
    const w = clamp(parseInt(widthInput.value) || 1, 1, maxW());
    heightInput.value = Math.round(w * logo().nativeH / logo().nativeW);
  });
  heightInput.addEventListener('input', () => {
    const h = clamp(parseInt(heightInput.value) || 1, 1, maxH());
    widthInput.value = Math.round(h * logo().nativeW / logo().nativeH);
  });
  allowUpscale.addEventListener('change', () => {
    widthInput.max = maxW();
    heightInput.max = maxH();
    // re-clamp whatever is currently entered against the new ceiling (matters when turning the toggle off)
    const w = clamp(parseInt(widthInput.value) || logo().nativeW, 1, maxW());
    widthInput.value = w;
    heightInput.value = Math.round(w * logo().nativeH / logo().nativeW);
  });
  document.getElementById('resetDimBtn').addEventListener('click', resetDimsToNative);

  // ---------- CMYK / TIFF export ----------
  // Generic per-pixel RGB->CMYK formula. This is NOT the same thing as the named brand CMYK
  // values shown in the swatches — those are calibrated per solid color; this runs on every
  // pixel of the actual rendered artwork (including anti-aliased edges, the outline's glow falloff,
  // and any shading), which a single named value can't represent. Real print production should
  // still color-manage/verify this file rather than treat it as final press-ready separation.
  function rgbToCmyk(r, g, b) {
    const rp = r / 255, gp = g / 255, bp = b / 255;
    const k = 1 - Math.max(rp, gp, bp);
    if (k >= 1) return [0, 0, 0, 255];
    const c = (1 - rp - k) / (1 - k);
    const m = (1 - gp - k) / (1 - k);
    const y = (1 - bp - k) / (1 - k);
    return [Math.round(c * 255), Math.round(m * 255), Math.round(y * 255), Math.round(k * 255)];
  }

  // Minimal uncompressed CMYK+alpha TIFF encoder. Structure validated with tifffile (a strict,
  // spec-complete reader) confirming correct tags and exact pixel round-trip before porting to JS.
  // Note: Pillow specifically cannot open CMYK+alpha TIFFs (tested directly) — that's a real gap
  // in one widely-used library, not a sign the file itself is malformed. Verify in the actual
  // software that will consume this (Photoshop, your print vendor's tooling) before relying on it.
  function buildCmykTiffBlob(width, height, cmykaBytes, dpi) {
    const HEADER_SIZE = 8;
    const N_ENTRIES = 14;
    const IFD_SIZE = 2 + N_ENTRIES * 12 + 4;
    const EXTRA_BASE = HEADER_SIZE + IFD_SIZE;

    const bitsPerSampleOffset = EXTRA_BASE;      // 5 x uint16 = 10 bytes
    const xResOffset = bitsPerSampleOffset + 10;
    const yResOffset = xResOffset + 8;
    const pixelOffset = yResOffset + 8;
    const totalSize = pixelOffset + cmykaBytes.length;

    const buf = new ArrayBuffer(totalSize);
    const view = new DataView(buf);
    const bytes = new Uint8Array(buf);
    const u16 = (offset, value) => view.setUint16(offset, value, true);
    const u32 = (offset, value) => view.setUint32(offset, value, true);

    bytes[0] = 0x49; bytes[1] = 0x49; // 'II' little-endian
    u16(2, 42);
    u32(4, HEADER_SIZE);

    const entries = [
      [256, 4, 1, { u32v: width }],
      [257, 4, 1, { u32v: height }],
      [258, 3, 5, { u32v: bitsPerSampleOffset }],
      [259, 3, 1, { pair: [1, 0] }],
      [262, 3, 1, { pair: [5, 0] }],  // PhotometricInterpretation = Separated (CMYK)
      [273, 4, 1, { u32v: pixelOffset }],
      [277, 3, 1, { pair: [5, 0] }],  // SamplesPerPixel = 5 (CMYK + alpha)
      [278, 4, 1, { u32v: height }],
      [279, 4, 1, { u32v: cmykaBytes.length }],
      [282, 5, 1, { u32v: xResOffset }],
      [283, 5, 1, { u32v: yResOffset }],
      [296, 3, 1, { pair: [2, 0] }],  // ResolutionUnit = inches
      [332, 3, 1, { pair: [1, 0] }],  // InkSet = CMYK
      [338, 3, 1, { pair: [2, 0] }],  // ExtraSamples = unassociated (straight) alpha
    ].sort((a, b) => a[0] - b[0]);

    let off = HEADER_SIZE;
    u16(off, entries.length); off += 2;
    for (const [tag, type, count, val] of entries) {
      u16(off, tag); off += 2;
      u16(off, type); off += 2;
      u32(off, count); off += 4;
      if (val.u32v !== undefined) u32(off, val.u32v);
      else { u16(off, val.pair[0]); u16(off + 2, val.pair[1]); }
      off += 4;
    }
    u32(off, 0); // no next IFD

    u16(bitsPerSampleOffset, 8); u16(bitsPerSampleOffset + 2, 8);
    u16(bitsPerSampleOffset + 4, 8); u16(bitsPerSampleOffset + 6, 8);
    u16(bitsPerSampleOffset + 8, 8);
    u32(xResOffset, dpi); u32(xResOffset + 4, 1);
    u32(yResOffset, dpi); u32(yResOffset + 4, 1);
    bytes.set(cmykaBytes, pixelOffset);

    return new Blob([buf], { type: 'image/tiff' });
  }

  // ---------- export ----------
  document.getElementById('exportBtn').addEventListener('click', async () => {
    const w = clamp(parseInt(widthInput.value) || logo().nativeW, 1, maxW());
    const h = clamp(parseInt(heightInput.value) || logo().nativeH, 1, maxH());

    const exportBtn = document.getElementById('exportBtn');
    exportBtn.disabled = true;
    exportBtn.textContent = 'Exporting…';
    await new Promise(r => setTimeout(r, 0)); // let the label above actually paint before the heavy work below
    const restoreLabel = () => exportBtn.textContent = colorMode === 'cmyk' ? 'Export TIFF (CMYK)' : 'Export PNG';

    try {
      const order = logo().drawOrder;
      const off = document.createElement('canvas');
      off.width = w; off.height = h;
      const octx = off.getContext('2d');

      for (const layer of order) {
        const img = await loadImage(layer, selection[activeLogo][layer]); // already cached from preview
        const scale = h / logo().nativeH;
        const dy = (logo().yOffset[layer] || 0) * scale;
        octx.drawImage(img, 0, dy, w, h);
      }

      const parts = order.map(l => selection[activeLogo][l]).join('-');
      const namePrefix = `twitch-${activeLogo.toLowerCase()}_${parts}_${w}x${h}`;

      if (colorMode === 'cmyk') {
        const imgData = octx.getImageData(0, 0, w, h).data;
        const cmykaBytes = new Uint8Array(w * h * 5);
        for (let i = 0, j = 0; i < imgData.length; i += 4, j += 5) {
          const [c, m, y, k] = rgbToCmyk(imgData[i], imgData[i + 1], imgData[i + 2]);
          cmykaBytes[j] = c; cmykaBytes[j + 1] = m; cmykaBytes[j + 2] = y; cmykaBytes[j + 3] = k;
          cmykaBytes[j + 4] = imgData[i + 3]; // carry the real alpha through untouched
        }
        const blob = buildCmykTiffBlob(w, h, cmykaBytes, 300);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${namePrefix}_CMYK.tif`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        exportBtn.disabled = false;
        restoreLabel();
      } else {
        off.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${namePrefix}.png`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          exportBtn.disabled = false;
          restoreLabel();
        }, 'image/png');
      }
    } catch (err) {
      console.error(err);
      alert(`Export failed.\n\n${err.message}`);
      exportBtn.disabled = false;
      restoreLabel();
    }
  });

  // ---------- init ----------
  syncPreviewSize();
  renderLogoButtons();
  renderLayerButtons();
  renderSwatchGrid();
  renderSelectionSummary();
  redraw();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twitch Logo Colorizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --twitch-bg:           #0e0e10;
    --twitch-surface:      #18181b;
    --twitch-surface2:     #1f1f23;
    --twitch-surface3:     #26262c;
    --twitch-border:       #2c2c31;
    --twitch-border2:      #3a3a3f;
    --twitch-purple:       #9147ff;
    --twitch-purple-hover: #772ce8;
    --twitch-purple-faint: rgba(145,71,255,0.1);
    --twitch-purple-glow:  rgba(145,71,255,0.15);
    --twitch-text:         #efeff1;
    --twitch-text-alt:     #dedee3;
    --twitch-text-dim:     #adadb8;
    --twitch-text-muted:   #6e6e78;
    --twitch-success:      #00c8a0;
    --twitch-warning:      #ffb31a;
    --twitch-error:        #ff6b6b;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --sidebar-width: 310px;
    --nav-height: 70px;
    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-lg: 8px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--twitch-bg);
    color: var(--twitch-text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- progress bar ---------- */
  #fetchBar {
    height: 3px; background: var(--twitch-surface2);
    position: fixed; top: var(--nav-height); left: 0; right: 0; z-index: 99;
    overflow: hidden; opacity: 0; transition: opacity .25s ease;
  }
  #fetchBar.active { opacity: 1; }
  #fetchBarFill {
    height: 100%; width: 0%; background: var(--twitch-purple);
    transition: width .3s ease, background-color .3s ease;
    box-shadow: 0 0 8px rgba(145,71,255,.6);
  }
  #fetchBarFill.done { background: var(--twitch-success); box-shadow: 0 0 8px rgba(0,200,160,.6); }

  /* ---------- topnav ---------- */
  .topnav {
    position: fixed; top: 0; left: 0; right: 0; height: var(--nav-height);
    background: var(--twitch-surface2); border-bottom: 1px solid var(--twitch-border);
    display: flex; align-items: center; padding: 0 20px; z-index: 100;
  }
  .topnav-mark {
    cursor: pointer; user-select: none; line-height: 1.15;
  }
  .topnav-title {
    font-size: 21px; font-weight: 700; letter-spacing: -0.02em; color: var(--twitch-text);
  }
  .topnav-title .accent { color: var(--twitch-purple); }


  /* ---------- layout shell ---------- */
  .sidebar {
    position: fixed; top: var(--nav-height); bottom: 0; left: 0; width: var(--sidebar-width);
    background: var(--twitch-surface); border-right: 1px solid var(--twitch-border);
    overflow-y: auto; z-index: 90;
  }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--twitch-border2); border-radius: 2px; }

  .sb-section { padding: 14px; border-bottom: 1px solid var(--twitch-border); }
  .tw-label {
    font-size: 10px; font-weight: 700; color: var(--twitch-text-muted);
    text-transform: uppercase; letter-spacing: .08em; display: block; margin-bottom: 8px;
  }

  .main-content {
    margin-left: var(--sidebar-width); margin-top: var(--nav-height);
    min-height: calc(100vh - var(--nav-height));
    display: flex; align-items: center; justify-content: center; padding: 40px;
  }

  /* ---------- layer select ---------- */
  .layer-select { display: flex; gap: 6px; }
  .layer-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    background: var(--twitch-surface2); border: 1px solid var(--twitch-border2);
    color: var(--twitch-text-dim); font-family: var(--font); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em; padding: 8px; border-radius: var(--radius-md);
    cursor: pointer; transition: all .12s ease;
  }
  .layer-btn:hover { border-color: var(--twitch-border2); color: var(--twitch-text-alt); }
  .layer-btn.active {
    background: var(--twitch-purple-faint); border-color: rgba(145,71,255,.5); color: var(--twitch-purple);
  }
  .layer-btn-icon-wrap {
    width: 100%; height: 34px; background: var(--twitch-bg); border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 7px;
  }
  .layer-btn-icon { max-width: 82%; max-height: 70%; object-fit: contain; display: block; }

  /* ---------- swatch grid ---------- */
  .swatch-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .swatch {
    aspect-ratio: 1; border-radius: var(--radius-sm); cursor: pointer;
    border: 2px solid var(--twitch-border2); position: relative;
    transition: transform .1s ease, border-color .1s ease;
  }
  .swatch:hover { transform: scale(1.06); }
  .swatch.active { border-color: #fff; box-shadow: 0 0 0 2px var(--twitch-purple); }

  .swatch-tooltip {
    position: fixed; z-index: 200; pointer-events: none;
    background: var(--twitch-surface3); border: 1px solid var(--twitch-border2);
    border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 700;
    color: var(--twitch-text); white-space: nowrap; opacity: 0;
    transition: opacity .1s ease; box-shadow: 0 4px 14px rgba(0,0,0,.45);
  }
  .swatch-tooltip.visible { opacity: 1; }
  .swatch-tooltip .hex { color: var(--twitch-text-muted); font-weight: 600; margin-left: 7px; }

  /* ---------- export ---------- */
  .dim-row { display: flex; align-items: flex-end; gap: 8px; }
  .dim-field { flex: 1; }
  .dim-x { padding-bottom: 8px; color: var(--twitch-text-muted); font-size: 12px; }
  .tw-input {
    width: 100%; background: var(--twitch-surface2); border: 1px solid var(--twitch-border2);
    border-radius: var(--radius-md); color: var(--twitch-text); font-family: var(--font);
    font-size: 13px; padding: 7px 10px; outline: none; transition: border-color .1s, box-shadow .1s;
  }
  .tw-input:focus { border-color: var(--twitch-purple); box-shadow: 0 0 0 3px var(--twitch-purple-glow); }
  .dim-hint { font-size: 11px; color: var(--twitch-text-muted); margin-top: 8px; line-height: 1.5; }

  .tw-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: none; border-radius: var(--radius-md); font-family: var(--font);
    font-size: 13px; font-weight: 600; cursor: pointer; padding: 10px 14px; transition: background .12s ease;
  }
  .tw-btn-primary { background: var(--twitch-purple); color: #fff; }
  .tw-btn-primary:hover { background: var(--twitch-purple-hover); }
  .tw-btn-primary:disabled { opacity: .5; cursor: default; }
  .tw-btn-sm { padding: 5px 10px; font-size: 11px; font-weight: 700; }
  .tw-btn-ghost { background: transparent; border: 1px solid var(--twitch-border2); color: var(--twitch-text-dim); }
  .tw-btn-ghost:hover { border-color: var(--twitch-text-muted); color: var(--twitch-text); }

  /* ---------- preview ---------- */
  .preview-wrap {
    width: 100%; max-width: 1400px; border-radius: var(--radius-lg);
    background-image:
      linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%);
    background-size: 24px 24px; background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    background-color: #161618;
    padding: 32px; position: relative;
  }
  #previewCanvas { display: block; width: 100%; height: auto; }

  .preview-stack { display: flex; flex-direction: column; align-items: center; gap: 22px; width: 100%; }

  .selection-summary { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .selection-chip {
    display: flex; align-items: center; gap: 10px;
    background: var(--twitch-surface2); border: 1px solid var(--twitch-border2);
    border-radius: var(--radius-lg); padding: 10px 16px;
  }
  .selection-chip .chip-dot {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--twitch-border2); flex-shrink: 0;
  }
  .selection-chip .chip-text { display: flex; flex-direction: column; line-height: 1.35; }
  .selection-chip .chip-layer {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    color: var(--twitch-text-muted);
  }
  .selection-chip .chip-color { font-size: 13px; font-weight: 700; color: var(--twitch-text); }
  .selection-chip .chip-hex { font-size: 11px; font-weight: 600; color: var(--twitch-text-muted); margin-left: 6px; }

  .state-container { text-align: center; padding: 72px 24px; }
  .state-title { font-size: 15px; font-weight: 700; color: var(--twitch-text-dim); margin-bottom: 6px; }
  .state-body { font-size: 12px; color: var(--twitch-text-muted); }

  @media (max-width: 760px) {
    .sidebar { position: static; width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--twitch-border); }
    .main-content { margin-left: 0; }
  }
</style>
</head>
<body>

  <div id="fetchBar"><div id="fetchBarFill"></div></div>

  <nav class="topnav">
    <div class="topnav-mark" onclick="window.location.reload()">
      <div class="topnav-title">Logo <span class="accent">Colorizer</span></div>
    </div>
  </nav>

  <aside class="sidebar">
    <div class="sb-section">
      <span class="tw-label">Layer</span>
      <div class="layer-select" id="layerSelect">
        <button class="layer-btn active" data-layer="Face">
          <span class="layer-btn-icon-wrap"><img class="layer-btn-icon" src="./assets:/Face_White.png" alt=""></span>
          <span>Face</span>
        </button>
        <button class="layer-btn" data-layer="Outline">
          <span class="layer-btn-icon-wrap"><img class="layer-btn-icon" src="./assets:/Outline_White.png" alt=""></span>
          <span>Outline</span>
        </button>
        <button class="layer-btn" data-layer="Extrusion">
          <span class="layer-btn-icon-wrap"><img class="layer-btn-icon" src="./assets:/Extrusion_White.png" alt=""></span>
          <span>Extrusion</span>
        </button>
      </div>
    </div>

    <div class="sb-section">
      <span class="tw-label">Color — <span id="activeLayerLabel">Face</span></span>
      <div class="swatch-grid" id="swatchGrid"></div>
    </div>

    <div class="sb-section">
      <span class="tw-label">Export Dimensions</span>
      <div class="dim-row">
        <div class="dim-field">
          <label class="tw-label" style="margin-bottom:5px;">Width</label>
          <input class="tw-input" id="exportWidth" type="number" min="1" max="5852">
        </div>
        <div class="dim-x">×</div>
        <div class="dim-field">
          <label class="tw-label" style="margin-bottom:5px;">Height</label>
          <input class="tw-input" id="exportHeight" type="number" min="1" max="1948">
        </div>
      </div>
      <div class="dim-hint">Max 5852 × 1948 (native resolution). Ratio is locked — edit either field.</div>
      <button class="tw-btn tw-btn-primary" id="exportBtn" style="width:100%; margin-top:12px;">Export PNG</button>
      <button class="tw-btn tw-btn-ghost tw-btn-sm" id="resetDimBtn" style="width:100%; margin-top:6px;">Reset to native size</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="preview-stack">
      <div class="preview-wrap">
        <canvas id="previewCanvas" width="5852" height="1948"></canvas>
      </div>
      <div class="selection-summary" id="selectionSummary"></div>
    </div>
  </main>

  <div class="swatch-tooltip" id="swatchTooltip"></div>

<script>
  // ---------- data ----------
  // key = exact color-name fragment used in filenames (Face_{key}.png, Outline_{key}.png, Extrusion_{key}.png)
  // Source of truth: filenames in the uploaded zips, cross-checked against the brand palette.
  // Note: "TwitchPurple" hex confirmed as 9146FF by Julian (differs from the 9147FF used
  // elsewhere in the Twitch brand system) — using the confirmed value here.
  // Ordered by hue (red -> orange -> yellow -> green -> cyan -> blue -> purple -> magenta -> red),
  // with low-saturation neutrals (black/gray/white) grouped at the end where hue is meaningless.
  const PALETTE = [
    { key: "Worm",         label: "Worm",          hex: "FACDCD" },
    { key: "Crash",        label: "Crash",         hex: "FF6905" },
    { key: "Dig",          label: "Dig",           hex: "904B1C" },
    { key: "Tangy",        label: "Tangy",         hex: "FDB210" },
    { key: "Star",         label: "Star",          hex: "FAFA19" },
    { key: "Ooze",         label: "Ooze",          hex: "BEFF00" },
    { key: "Junimo",       label: "Junimo",        hex: "00FA05" },
    { key: "Grass",        label: "Grass",         hex: "009919" },
    { key: "Rosalina",     label: "Rosalina",      hex: "BEFAE1" },
    { key: "Rune",         label: "Rune",          hex: "69FDC2" },
    { key: "Linc",         label: "Linc",          hex: "006441" },
    { key: "Surf",         label: "Surf",          hex: "00C8AF" },
    { key: "Pylon",        label: "Pylon",         hex: "00FAFA" },
    { key: "Knights",      label: "Knights",       hex: "215264" },
    { key: "Mana",         label: "Mana",          hex: "57BEE6" },
    { key: "Zero",         label: "Zero",          hex: "1E69FF" },
    { key: "Sonic",        label: "Sonic",         hex: "0014A5" },
    { key: "Ice",          label: "Ice",           hex: "F0F0FF" },
    { key: "Smoke",        label: "Smoke",         hex: "D2D2E6" },
    { key: "Widow",        label: "Widow",         hex: "BFABFF" },
    { key: "TwitchPurple", label: "Twitch Purple", hex: "9146FF" },
    { key: "Twilight",     label: "Twilight",      hex: "41145F" },
    { key: "Dragon",       label: "Dragon",        hex: "8205B4" },
    { key: "Jiggle",       label: "Jiggle",        hex: "FF8DFF" },
    { key: "Cuddle",       label: "Cuddle",        hex: "FA1ED2" },
    { key: "Edgeworth",    label: "Edgeworth",     hex: "BE0078" },
    { key: "Overlord",     label: "Overlord",      hex: "821946" },
    { key: "Scourge",      label: "Scourge",       hex: "A91A26" },
    { key: "Peach",        label: "Peach",         hex: "EA7078" },
    { key: "Barrel",       label: "Barrel",        hex: "F7262C" },
    { key: "BlackOps",     label: "Black Ops",     hex: "000000" },
    { key: "Iron",         label: "Iron",          hex: "91919F" },
    { key: "White",        label: "White",         hex: "FFFFFF" },
  ];

  const LAYERS = ["Extrusion", "Outline", "Face"]; // back-to-front render order — Face sits above Outline
  const NATIVE_W = 5852, NATIVE_H = 1948;
  const RATIO = NATIVE_W / NATIVE_H;

  // The Face layer's source files were padded to the native canvas with the content
  // vertically centered, which doesn't match where Outline/Extrusion actually sit.
  // Measured directly against Outline's inner edges: Face needs to move up 225px at
  // native resolution. Expressed in native px, then scaled to whatever size is drawn.
  const LAYER_Y_OFFSET = { Face: -225, Outline: 0, Extrusion: 0 };

  // Starting selection.
  const selection = { Face: "White", Outline: "TwitchPurple", Extrusion: "TwitchPurple" };
  let activeLayer = "Face";

  const imgCache = new Map(); // "Layer_Key" -> HTMLImageElement (loaded)

  function assetPath(layer, key) {
    return `./assets:/${layer}_${key}.png`;
  }

  function loadImage(layer, key) {
    const cacheKey = `${layer}_${key}`;
    if (imgCache.has(cacheKey)) return Promise.resolve(imgCache.get(cacheKey));
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => { imgCache.set(cacheKey, img); resolve(img); };
      img.onerror = () => reject(new Error(`Failed to load ${assetPath(layer, key)}`));
      img.src = assetPath(layer, key);
    });
  }

  // ---------- progress bar ----------
  const fetchBar = document.getElementById('fetchBar');
  const fetchBarFill = document.getElementById('fetchBarFill');
  function barStart() {
    fetchBarFill.classList.remove('done');
    fetchBarFill.style.width = '0%';
    fetchBar.classList.add('active');
  }
  function barProgress(frac) { fetchBarFill.style.width = `${Math.round(frac * 100)}%`; }
  function barDone() {
    fetchBarFill.classList.add('done');
    fetchBarFill.style.width = '100%';
    setTimeout(() => fetchBar.classList.remove('active'), 350);
  }

  // ---------- canvas render ----------
  const canvas = document.getElementById('previewCanvas');
  const ctx = canvas.getContext('2d');

  async function redraw() {
    barStart();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let done = 0;
    try {
      for (const layer of LAYERS) {
        const img = await loadImage(layer, selection[layer]);
        const scale = canvas.height / NATIVE_H;
        const dy = (LAYER_Y_OFFSET[layer] || 0) * scale;
        ctx.drawImage(img, 0, dy, canvas.width, canvas.height);
        done++;
        barProgress(done / LAYERS.length);
      }
      barDone();
    } catch (err) {
      barDone();
      console.error(err);
      alert(`Couldn't load a layer image.\n\n${err.message}\n\nCheck that the "assets:" folder is deployed next to this HTML file and the filename matches exactly.`);
    }
  }

  // ---------- sidebar: layer select ----------
  const layerBtns = document.querySelectorAll('.layer-btn');
  const activeLayerLabel = document.getElementById('activeLayerLabel');

  layerBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      activeLayer = btn.dataset.layer;
      layerBtns.forEach(b => b.classList.toggle('active', b === btn));
      activeLayerLabel.textContent = activeLayer;
      updateSwatchActiveStates();
    });
  });

  // ---------- sidebar: swatch grid ----------
  const swatchGrid = document.getElementById('swatchGrid');
  const tooltip = document.getElementById('swatchTooltip');

  function positionTooltip(evt) {
    tooltip.style.left = (evt.clientX + 18) + 'px';
    tooltip.style.top = (evt.clientY - 14) + 'px';
  }

  function renderSwatchGrid() {
    swatchGrid.innerHTML = '';
    PALETTE.forEach(c => {
      const el = document.createElement('div');
      el.className = 'swatch';
      el.style.background = `#${c.hex}`;
      el.dataset.key = c.key;
      el.addEventListener('mouseenter', (evt) => {
        tooltip.innerHTML = `${c.label}<span class="hex">#${c.hex}</span>`;
        tooltip.classList.add('visible');
        positionTooltip(evt);
      });
      el.addEventListener('mousemove', positionTooltip);
      el.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));
      el.addEventListener('click', () => {
        selection[activeLayer] = c.key;
        updateSwatchActiveStates();
        renderSelectionSummary();
        redraw();
      });
      swatchGrid.appendChild(el);
    });
    updateSwatchActiveStates();
  }

  function updateSwatchActiveStates() {
    const current = selection[activeLayer];
    [...swatchGrid.children].forEach(el => {
      el.classList.toggle('active', el.dataset.key === current);
    });
  }

  // ---------- selection summary beneath the canvas ----------
  const selectionSummaryEl = document.getElementById('selectionSummary');
  function renderSelectionSummary() {
    selectionSummaryEl.innerHTML = ["Face", "Outline", "Extrusion"].map(layer => {
      const c = PALETTE.find(p => p.key === selection[layer]);
      return `<div class="selection-chip">
        <span class="chip-dot" style="background:#${c.hex}"></span>
        <span class="chip-text">
          <span class="chip-layer">${layer}</span>
          <span class="chip-color">${c.label}<span class="chip-hex">#${c.hex}</span></span>
        </span>
      </div>`;
    }).join('');
  }

  // ---------- export dimensions ----------
  const widthInput = document.getElementById('exportWidth');
  const heightInput = document.getElementById('exportHeight');

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

  widthInput.value = NATIVE_W;
  heightInput.value = NATIVE_H;

  widthInput.addEventListener('input', () => {
    const w = clamp(parseInt(widthInput.value) || 1, 1, NATIVE_W);
    heightInput.value = Math.round(w / RATIO);
  });
  heightInput.addEventListener('input', () => {
    const h = clamp(parseInt(heightInput.value) || 1, 1, NATIVE_H);
    widthInput.value = Math.round(h * RATIO);
  });
  document.getElementById('resetDimBtn').addEventListener('click', () => {
    widthInput.value = NATIVE_W;
    heightInput.value = NATIVE_H;
  });

  // ---------- export ----------
  document.getElementById('exportBtn').addEventListener('click', async () => {
    const w = clamp(parseInt(widthInput.value) || NATIVE_W, 1, NATIVE_W);
    const h = clamp(parseInt(heightInput.value) || NATIVE_H, 1, NATIVE_H);

    const exportBtn = document.getElementById('exportBtn');
    exportBtn.disabled = true;
    exportBtn.textContent = 'Exporting…';

    try {
      const off = document.createElement('canvas');
      off.width = w; off.height = h;
      const octx = off.getContext('2d');
      for (const layer of LAYERS) {
        const img = await loadImage(layer, selection[layer]); // already cached from preview
        const scale = h / NATIVE_H;
        const dy = (LAYER_Y_OFFSET[layer] || 0) * scale;
        octx.drawImage(img, 0, dy, w, h);
      }
      off.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const parts = LAYERS.map(l => selection[l]).join('-');
        a.href = url;
        a.download = `twitch-logo_${parts}_${w}x${h}.png`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        exportBtn.disabled = false;
        exportBtn.textContent = 'Export PNG';
      }, 'image/png');
    } catch (err) {
      console.error(err);
      alert(`Export failed.\n\n${err.message}`);
      exportBtn.disabled = false;
      exportBtn.textContent = 'Export PNG';
    }
  });

  // ---------- init ----------
  renderSwatchGrid();
  renderSelectionSummary();
  redraw();
</script>
</body>
</html>
